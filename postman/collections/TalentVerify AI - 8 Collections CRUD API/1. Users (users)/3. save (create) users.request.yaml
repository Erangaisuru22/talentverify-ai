$kind: http-request
url: "{{baseUrl}}/api/crud/users"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "name": "Nimal Perera",
      "email": "nimal.perera@example.com",
      "role": "candidate",
      "password": "abcd123@",
      "headline": "Full Stack Developer",
      "location": "Colombo, Sri Lanka",
      "phone": "+94 77 111 2222",
      "isActive": true
    }
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (res.id) { pm.collectionVariables.set('userId', res.id); }
    language: text/javascript
order: 3000
