$kind: http-request
url: "{{baseUrl}}/api/crud/evidence_snapshots"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "candidate_id": "CAND-001",
      "platform": "github",
      "username": "demo-candidate",
      "profile_url": "https://github.com/demo-candidate",
      "verification_status": "verified",
      "verification_score": 92.0,
      "verified_technologies": [
        "React",
        "Python",
        "FastAPI",
        "TypeScript",
        "Docker"
      ],
      "verified_at": "2026-09-24T12:00:00+00:00"
    }
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (res.id) { pm.collectionVariables.set('snapshotId', res.id); }
    language: text/javascript
order: 3000
