$kind: http-request
url: "{{baseUrl}}/api/crud/applications/{{applicationId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "status": "Shortlisted",
      "notes": "Candidate passed initial review. Scheduled for technical interview."
    }
order: 4000
