$kind: http-request
url: "{{baseUrl}}/api/crud/cv_documents/{{cvId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "parsing_status": "completed",
      "notes": "CV verified and parsed successfully."
    }
order: 4000
